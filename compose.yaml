services:
  app1:
    image: lab-app:2.0
    environment:
      APP_NAME: app1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  app2:
    image: lab-app:2.0
    environment:
      APP_NAME: app2
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  balanceador:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy